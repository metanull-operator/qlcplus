name: Windows build

on:
  workflow_dispatch:
  push:

jobs:
  windows:
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - name: Install Qt 5.15.2 with MinGW toolchain
        uses: jurplel/install-qt-action@v4
        with:
          version: '5.15.2'
          host: 'windows'
          target: 'desktop'
          arch: 'win64_mingw81'
          modules: 'qtscript'
          tools: 'tools_mingw,qt.tools.win64_mingw810'

      - name: Sanity check
        run: |
          which qmake && qmake --version
          which mingw32-make || find "$IQTA_TOOLS" -name "mingw32-make.exe" || true

      - name: qmake
        run: qmake qlc.pro

      - name: Build
        run: mingw32-make -j4

      - name: Install to staging folder
        run: mingw32-make install

      - name: Deploy Qt runtime into staging
        run: windeployqt /c/qlcplus/qlcplus.exe || true

      - name: Portable zip
        shell: pwsh
        run: Compress-Archive -Path C:\qlcplus\* -DestinationPath "$env:GITHUB_WORKSPACE\QLCplus-portable-win64.zip"

      - name: NSIS installer
        continue-on-error: true
        shell: pwsh
        run: |
          choco install nsis -y --no-progress
          New-Item -ItemType Directory -Force -Path C:\projects | Out-Null
          Copy-Item -Recurse -Force $env:GITHUB_WORKSPACE C:\projects\qlcplus
          Set-Location C:\qlcplus
          & "C:\Program Files (x86)\NSIS\makensis.exe" C:\projects\qlcplus\platforms\windows\qlcplus4Qt5.nsi
          Copy-Item C:\qlcplus\QLC+_*.exe $env:GITHUB_WORKSPACE\ -ErrorAction SilentlyContinue

      - uses: actions/upload-artifact@v4
        with:
          name: QLCplus-windows-portable
          path: QLCplus-portable-win64.zip

      - uses: actions/upload-artifact@v4
        with:
          name: QLCplus-windows-installer
          path: QLC+_*.exe
          if-no-files-found: ignore
